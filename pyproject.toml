[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genphysical"
version = "1.0.0"
description = "Reference implementation of GenPhysiCal and DECI-Net (Applied Energy 375 (2024) 124080)"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Dagimawi D. Eneyew" },
    { name = "Miriam A. M. Capretz" },
    { name = "Girma T. Bitsuamlak" },
]
keywords = [
    "digital-twin",
    "building-energy-model",
    "model-calibration",
    "normalizing-flows",
    "invertible-neural-network",
    "energyplus",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Core dependencies. Everything needed to build datasets, train the calibrator
# models and compute every metric reported in the paper.
dependencies = [
    "numpy>=1.23,<2.0",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "joblib>=1.2",
    # TensorFlow 2.16+ switches the default Keras to Keras 3, which does not
    # support the custom `train_step` / `save_weights(save_format="tf")` pattern
    # used by the calibrator models. Stay on the Keras 2 line.
    "tensorflow>=2.12,<2.16",
    "tensorflow-probability>=0.20,<0.24",
]

[project.optional-dependencies]
# Only needed for the EnergyPlus stages (scripts 00-02 and 06). Everything else
# runs from the generated CSV files and does not need EnergyPlus installed.
energyplus = [
    "eppy>=0.5.63",
    "diyepw>=1.1",
]
dev = [
    "pytest>=7.0",
    "properscoring>=0.1",  # optional cross-check for the CRPS implementation
]

[project.urls]
Paper = "https://doi.org/10.1016/j.apenergy.2024.124080"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
